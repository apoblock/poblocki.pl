---
layout: none
permalink: /
---
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pobłocki</title>
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <link rel="alternate" hreflang="pl" href="{{ '/pl/' | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ '/en/' | absolute_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
      (function () {
        var lang = "en";
        var saved = null;
        var base = {{ site.baseurl | default: "" | jsonify }};
        try { saved = localStorage.getItem("lang"); } catch (e) {}
        if (saved === "pl" || saved === "en") {
          lang = saved;
        } else {
          var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
          for (var i = 0; i < list.length; i++) {
            if (String(list[i] || "").toLowerCase().indexOf("pl") === 0) {
              lang = "pl";
              break;
            }
          }
        }
        window.location.replace(base + "/" + lang + "/");
      })();
    </script>
  </head>
  <body>
    <div id="header_wrap" class="outer">
      <header class="inner">
        <h1 id="project_title">Pobłocki</h1>
      </header>
    </div>
    <div id="main_content_wrap" class="outer">
      <section id="main_content" class="inner">
        <p>
          <a href="{{ '/pl/' | relative_url }}" lang="pl" hreflang="pl" data-lang="pl">Polski</a>
          ·
          <a href="{{ '/en/' | relative_url }}" lang="en" hreflang="en" data-lang="en">English</a>
        </p>
      </section>
    </div>
    <script>
      document.addEventListener("click", function (event) {
        var link = event.target.closest("a[data-lang]");
        if (!link) return;
        try { localStorage.setItem("lang", link.getAttribute("data-lang")); } catch (e) {}
      });
    </script>
  </body>
</html>
