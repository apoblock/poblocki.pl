theme: jekyll-theme-slate
url: https://poblocki.family
title: Pobłocki
description: Historia rodu Pobłockich z Linii
permalink: pretty
defaults:
  - scope:
      path: ""
    values:
      layout: default
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - CNAME
  - README.md
  - _research
